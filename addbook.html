<div class="container">
  <h2>Add New Book</h2>

  <form>

    <label>Book</label>
    <input type="text" placeholder="e.g. C-Programming">

    <label>Subject Code</label>
    <input type="text" placeholder="e.g. E1280298">

    <label>Semester</label>
    <input type="email" placeholder="e.g. 3">

    <label>Department</label>
    <input type="text" placeholder="e.g. IT">

    <div class="buttons">
      <button type="submit" class="save">Save</button>
      <button type="reset" class="cancel">Clear</button>
    </div>

  </form>
</div>
<script src="addbook.js"></script>
